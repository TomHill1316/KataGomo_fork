# search-tier12.cfg — 高算力下的 MCTS 搜索广度（Tier 1 / Tier 2）
#
# 用法（作为**第二个** -config 传入；KataGo 允许多个 -config，但第二个及以后
# 必须是相对路径，绝对路径会被 config_parser.cpp:102-105 拒绝）：
#
#   ./katago gtp -config config/gtp_sm89_plan_pruned.cfg \
#                -config config/search-tier12.cfg \
#                -model models/b11-ffn-pruned-a8.bin.gz
#
# ⚠️ 需要带 Tier1/2 补丁的二进制（分支 search-adaptive-explore）。
#    旧二进制不认下面两个新键 → 只会报 unused key 警告并忽略，不会崩。
#
# ⚠️ 与 CUDA tactic plan 无关：搜索参数不进 plan 的四道护栏，
#    也不会改变 nnMaxBatchSize / batch 认证。
#
# ============================================================================
# 实测依据（RTX 4090D 单卡，midgame8，同轮配对 + 臂序轮换，漂移作噪声标尺）
# ============================================================================
# 【A】N = 20,000 访问（4 轮，2 局面）
#   midgame8 基线：top1=0.9649  熵=0.2042  w90=1  n>=1%=2
#   opening4 基线：top1=0.9362  熵=0.2893  w90=1  n>=1%=3
#
#   臂                                    midgame8 top1      opening4 top1     判定
#   F  wideRootNoise=0.03                 0.6921 (−0.273)    0.5446 (−0.392)   最强
#   C  cpuctExplorationFloorCoeff=0.05    0.9347 (−0.030)    0.8291 (−0.107)   有效
#   E  rootMinVisitShare=0.02             0.9486 (−0.016)    0.9194 (−0.017)   有效（弱）
#   B  cpuctExplorationFloorCoeff=0.02    0.9650 (+0.000)    0.8987 (−0.038)   基本噪声内
#   D  rootMinVisitShare=0.01             0.9640 (−0.001)    0.9286 (−0.008)   噪声内
#
# 【B】N = 200,000 访问（2 轮，midgame8）—— 漂移仅 0.0002，判定很硬
#   基线：top1=0.9919  熵=0.0588  w90=1  n>=1%=1        ← 访问量涨 10 倍后明显更塌
#
#   臂                                       Δtop1            Δ熵        Δn>=1%   判定
#   F  wideRootNoise=0.03                    −0.1891         +0.6856     +3.5     最强
#   C  cpuctExplorationFloorCoeff=0.05       −0.0381         +0.1993     +2       有效
#   E  rootMinVisitShare=0.02                −0.0361         +0.1759     +3       有效
#   G  floor=0.02 + wideRootNoise=0.01       −0.0251         +0.1378     +1       有效
#   B  cpuctExplorationFloorCoeff=0.02       −0.0140         +0.0794     +1       有效
#
# ★★ 核心结论：**同一个旋钮的效果随 N 增长** ★★
#   同一局面、同一臂 B（k=0.02）：N=2e4 时 Δtop1=+0.0001（噪声内）→ N=2e5 时 −0.0140（70× 漂移）。
#   这正是下面 N* 阈值公式预测的行为，不是偶然。
#   ⇒ 你实战是「算了几百 M」的量级（N~1e6–1e7），地板会比这里的 200k 更强约 2–3 倍。
#   ⇒ 而 wideRootNoise 的效果**与 N 无关**，随基线塌缩反而相对变弱（−0.273 → −0.189）。

# ---------------------------------------------------------------------------
# Tier 1：给有效 cpuct 加一个 √N 地板
# ---------------------------------------------------------------------------
# 实现：有效 cpuct = max(cpuctExploration(N), cpuctExplorationFloorCoeff * sqrt(N))
#
# 关键性质：**地板只随 N 增大才起作用**。地板与原生项相等的位置是
#     N* ≈ (cpuctExploration(N) / k)^2
#   k=0.02 → N*≈2e4（所以 20000 访问实测刚好是噪声内！）
#             N=1e5 时约 1.9×，N=1e6 时约 4.5×，N=1e7 时约 12×
#   k=0.05 → N*≈3e3（所以 20000 访问时已经明显起作用）
#
# 语义：把「效用分辨率」的地板钉在 k 附近，不再随 N 无限变细。
# NN 价值是**系统性偏差**（量级 0.03–0.13），平均多少次都不消失 ⇒
# 分辨率细过这个量级就是在噪声里细分，根节点会塌成一两个点。
#
# ⇒ 这正是「算力越高越需要」的形状。**高算力场景的首选旋钮。**
# 起步用 0.02；若在 1e6+ 访问下仍不够广，再升到 0.03–0.05。
cpuctExplorationFloorCoeff = 0.02

# ---------------------------------------------------------------------------
# Tier 2：根节点最小访问份额（不随 N 衰减）
# ---------------------------------------------------------------------------
# 凡是原始 policy ≥ rootMinVisitSharePolicyMin 的根子节点，必须被搜到
# 占总根权重 rootMinVisitShare 的份额为止。
#
# 与上游 rootDesiredPerChildVisitsCoeff 的区别（这是本参数存在的理由）：
#   上游门槛 = sqrt(P·N·coeff) ∝ √N ⇒ 在 N=2e4、P≈0.1 时只要求约 45 次访问，
#   而基线 top1 已有约 19000 次 ⇒ 早已完全失效（已实测证实）。
#   本参数是**固定份额**，不随 N 衰减。
#
# 安全性：只影响搜索期的访问分配，**不会**影响最终选点 ——
#   强制值 1e20 落在 isDuringSearch && parent==rootNode 的守卫内，
#   而最终选点路径 searchresults.cpp:164 传的是 isDuringSearch=false。
#
# 起步 0.01–0.02。设太大（≥0.05）会挤占真正好点的预算。
rootMinVisitShare = 0.02
rootMinVisitSharePolicyMin = 0.02

# ---------------------------------------------------------------------------
# Tier 0（老二进制也认）：宽根噪声 —— 实测最强，但是纯随机
# ---------------------------------------------------------------------------
# wideRootNoise 在根节点给每个子节点的效用加噪声。它对分布的打散效果
# 远大于上面两个（top1 直接砍掉 0.19–0.39），但**不区分好坏点**，
# 会把访问推向确实差的点。它的效果**不随 N 增长**，所以对高算力场景
# 不如 Tier 1 地板对症。
#
# 实测的温和组合 G（floor=0.02 + noise=0.01）在 N=200k 下：
#   Δtop1 = −0.0251、Δ熵 = +0.1378，**优于两者单独使用**，
#   而噪声只有 0.03 的 1/3 ⇒ 广度/风险比最好的一档。
#
# 建议：先用 Tier 1 + Tier 2；若还不够广，再加这一行。
# 加之前请用对局胜率验证（见文件末尾的风险提示）。
#
# wideRootNoise = 0.01
#
# ============================================================================
# ⚠️ 重要限制：以上全部是**广度指标**（根访问分布的分散程度），
#    不是棋力。更广 ≠ 更强。尤其 wideRootNoise 是纯随机化，
#    有可能掉 Elo。上线前必须用对局胜率做验收。
#    验收建议：固定相同时间/访问预算，与基线跑 ≥200 局配对对局，
#    用 SPRT 或至少看置信区间；同轮配对、轮换先后手。
